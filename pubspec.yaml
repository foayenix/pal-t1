name: pal_app
description: PAL - Point and Lift. Snap a photo of gym equipment and learn how to use it.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # Camera & Image
  image_picker: ^1.0.7

  # Claude API calls for equipment recognition
  http: ^1.2.0

  # Opens exercise demo videos in YouTube / the browser
  url_launcher: ^6.2.0

  # UI
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  image_picker_platform_interface: ^2.11.2

flutter:
  uses-material-design: true

  # Bundled so text renders correctly with no signal (gyms are often basements).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
